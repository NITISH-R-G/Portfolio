# Netlify serves from the root, so portfolio.config.js should have `site.base: "/"`.
# `npm run doctor` warns if the two disagree.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hashed asset filenames change whenever their contents do, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The portfolio is a single page; anything else is a mistyped URL and should land on it
# rather than on Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
