name: Deploy portfolio

# Works unmodified in any fork: nothing here hardcodes a repository name, a username or a
# base path. The base path comes from `site.base` in portfolio.config.js, and the verify
# step reads it back out of the same config rather than asserting a literal.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # A portfolio should not go stale because its owner stopped running `npm run import`.
  # This refreshes the data weekly. Remove the block if you prefer to import by hand.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Every secret below is optional. A connector with no credential either runs on its
      # public rate limit or reports itself unavailable — neither fails the build.
      #
      # GITHUB_TOKEN is provided by Actions automatically and needs no setup; it raises the
      # GitHub API rate limit and unlocks pinned repositories and contribution totals.
      # Add any others under Settings → Secrets and variables → Actions.
      - name: Import profile data
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: npm run import

      # Precompute the semantic search index.
      #
      # Non-fatal here so the step's own error output survives into the log, but NOT ignored:
      # the verify step below refuses to deploy without the index. A CDN hiccup therefore
      # fails the run and leaves the previous deployment — with its working search — live,
      # rather than quietly replacing it with a lexical-only site nobody would notice was
      # degraded. Re-running the workflow is the fix.
      - name: Build the semantic search index
        continue-on-error: true
        run: npm run embed

      - name: Check the configuration
        run: npm run doctor

      - name: Build
        run: npm run build

      - name: Verify the built output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets

          # Read the configured base path rather than assuming one, then confirm the built
          # HTML actually references assets under it. A mismatch here is the single most
          # common cause of a blank deployed page, and it is silent without this check.
          BASE=$(node -e "import('./scripts/lib/loadConfig.mjs').then(m => m.loadResolvedConfig()).then(r => console.log(r.config.site.base))")
          echo "Configured base path: $BASE"

          if ! grep -q "src=\"${BASE}assets/" dist/index.html; then
            echo "::error::Built HTML does not reference assets under '$BASE'."
            echo "Set site.base in portfolio.config.js to '/<your-repo-name>/' for a GitHub Pages project site."
            exit 1
          fi

          # The SEO plugin bakes the real title into the HTML; a placeholder means it did
          # not run and every shared link would unfurl as "Portfolio".
          if grep -q "<title>Portfolio</title>" dist/index.html; then
            echo "::error::index.html still has the placeholder title. Check identity.name in portfolio.config.js."
            exit 1
          fi

          # The embedding index is generated output and is not committed, so the only thing
          # standing between a CDN failure and a silently lexical-only deployment is this
          # check. The manifest reports what search the built site can actually do, so it is
          # the honest thing to assert against — it is derived from the index's presence
          # rather than from the step above having been attempted.
          SEARCH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/portfolio.json','utf8')).capabilities.search)")
          echo "Search capability: $SEARCH"

          if [ "$SEARCH" != "hybrid-semantic" ]; then
            echo "::error::Built site reports '$SEARCH' — the semantic index is missing."
            echo "The 'Build the semantic search index' step above did not produce src/data/generated/embeddings.json."
            echo "Re-run this workflow; the model is fetched from a CDN and the failure is usually transient."
            exit 1
          fi

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
