<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <!--
    This tag is replaced at runtime by src/main.jsx with the real, data-derived title,
    description, Open Graph tags, Twitter Card tags and JSON-LD — generated from
    portfolio.config.js and the imported profile by core/generate/seo.js. It exists so
    something reasonable renders if JavaScript fails to run, and so `view-source` shows a
    real anchor element to replace.
  -->
  <meta id="seo-head" name="description" content="An open-source, data-driven developer portfolio.">
  <meta name="generator" content="portfolio-engine">

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
